@keyframes summit-sh-r{0%{transform:rotate(80deg)} 9%{transform:rotate(0deg)} 28%{transform:rotate(175deg)} 74%{transform:rotate(175deg)} 82%{transform:rotate(0deg)} 88%{transform:rotate(40deg)} 94%{transform:rotate(65deg)} 100%{transform:rotate(80deg)}}
@keyframes summit-torso{0%{transform:rotate(-4deg)} 9%{transform:rotate(0deg)} 28%{transform:rotate(0deg)} 40%{transform:rotate(3deg)} 42.5%{transform:rotate(-3deg)} 45%{transform:rotate(3deg)} 47.5%{transform:rotate(-3deg)} 50%{transform:rotate(3deg)} 52.5%{transform:rotate(-3deg)} 55%{transform:rotate(3deg)} 57.5%{transform:rotate(-3deg)} 60%{transform:rotate(3deg)} 62.5%{transform:rotate(-3deg)} 65%{transform:rotate(3deg)} 67.5%{transform:rotate(-3deg)} 70%{transform:rotate(3deg)} 74%{transform:rotate(0deg)} 82%{transform:rotate(0deg)} 88%{transform:rotate(0deg)} 100%{transform:rotate(-4deg)}}
@keyframes summit-head{0%{transform:rotate(-6deg)} 9%{transform:rotate(0deg)} 13%{transform:rotate(-10deg)} 17%{transform:rotate(10deg)} 21%{transform:rotate(0deg)} 28%{transform:rotate(0deg)} 34%{transform:rotate(-6deg)} 37%{transform:rotate(0deg)} 40%{transform:rotate(-5deg)} 42.5%{transform:rotate(5deg)} 45%{transform:rotate(-5deg)} 47.5%{transform:rotate(5deg)} 50%{transform:rotate(-5deg)} 52.5%{transform:rotate(5deg)} 55%{transform:rotate(-5deg)} 57.5%{transform:rotate(5deg)} 60%{transform:rotate(-5deg)} 62.5%{transform:rotate(5deg)} 65%{transform:rotate(-5deg)} 67.5%{transform:rotate(5deg)} 70%{transform:rotate(-5deg)} 74%{transform:rotate(0deg)} 82%{transform:rotate(0deg)} 88%{transform:rotate(0deg)} 100%{transform:rotate(-6deg)}}
@keyframes summit-ua-l{0%{transform:rotate(165deg)} 9%{transform:rotate(10deg)} 28%{transform:rotate(40deg)} 40%{transform:rotate(26deg)} 42.5%{transform:rotate(14deg)} 45%{transform:rotate(26deg)} 47.5%{transform:rotate(14deg)} 50%{transform:rotate(26deg)} 52.5%{transform:rotate(14deg)} 55%{transform:rotate(26deg)} 57.5%{transform:rotate(14deg)} 60%{transform:rotate(26deg)} 62.5%{transform:rotate(14deg)} 65%{transform:rotate(26deg)} 67.5%{transform:rotate(14deg)} 70%{transform:rotate(26deg)} 74%{transform:rotate(40deg)} 82%{transform:rotate(10deg)} 88%{transform:rotate(150deg)} 100%{transform:rotate(165deg)}}
@keyframes summit-fa-l{0%{transform:rotate(15deg)} 9%{transform:rotate(0deg)} 28%{transform:rotate(20deg)} 40%{transform:rotate(-116deg)} 42.5%{transform:rotate(-104deg)} 45%{transform:rotate(-116deg)} 47.5%{transform:rotate(-104deg)} 50%{transform:rotate(-116deg)} 52.5%{transform:rotate(-104deg)} 55%{transform:rotate(-116deg)} 57.5%{transform:rotate(-104deg)} 60%{transform:rotate(-116deg)} 62.5%{transform:rotate(-104deg)} 65%{transform:rotate(-116deg)} 67.5%{transform:rotate(-104deg)} 70%{transform:rotate(-116deg)} 74%{transform:rotate(20deg)} 82%{transform:rotate(0deg)} 88%{transform:rotate(10deg)} 100%{transform:rotate(15deg)}}
@keyframes summit-ua-r{0%{transform:rotate(-70deg)} 9%{transform:rotate(-10deg)} 28%{transform:rotate(-40deg)} 40%{transform:rotate(-14deg)} 42.5%{transform:rotate(-26deg)} 45%{transform:rotate(-14deg)} 47.5%{transform:rotate(-26deg)} 50%{transform:rotate(-14deg)} 52.5%{transform:rotate(-26deg)} 55%{transform:rotate(-14deg)} 57.5%{transform:rotate(-26deg)} 60%{transform:rotate(-14deg)} 62.5%{transform:rotate(-26deg)} 65%{transform:rotate(-14deg)} 67.5%{transform:rotate(-26deg)} 70%{transform:rotate(-14deg)} 74%{transform:rotate(-40deg)} 82%{transform:rotate(-10deg)} 88%{transform:rotate(-150deg)} 100%{transform:rotate(-70deg)}}
@keyframes summit-fa-r{0%{transform:rotate(-110deg)} 9%{transform:rotate(0deg)} 28%{transform:rotate(-20deg)} 40%{transform:rotate(104deg)} 42.5%{transform:rotate(116deg)} 45%{transform:rotate(104deg)} 47.5%{transform:rotate(116deg)} 50%{transform:rotate(104deg)} 52.5%{transform:rotate(116deg)} 55%{transform:rotate(104deg)} 57.5%{transform:rotate(116deg)} 60%{transform:rotate(104deg)} 62.5%{transform:rotate(116deg)} 65%{transform:rotate(104deg)} 67.5%{transform:rotate(116deg)} 70%{transform:rotate(104deg)} 74%{transform:rotate(-20deg)} 82%{transform:rotate(0deg)} 88%{transform:rotate(-10deg)} 100%{transform:rotate(-110deg)}}
@keyframes summit-puffs{0%,38%{opacity:0;transform:translate(0,0)}44%,52%,60%,68%{opacity:1;transform:translate(0,0)}48%,56%,64%{opacity:.2;transform:translate(3px,-4px)}74%,100%{opacity:0}}
@keyframes summit-brr{0%,39%{opacity:0}42%,70%{opacity:1}74%,100%{opacity:0}}
.is-climbing .j-body{animation:climb-body var(--climb-dur) ease-in-out infinite}
.is-climbing .j-th-l{animation:climb-th-l var(--climb-dur) ease-in-out infinite}
.is-climbing .j-sh-l{animation:climb-sh-l var(--climb-dur) ease-in-out infinite}
.is-climbing .j-th-r{animation:climb-th-r var(--climb-dur) ease-in-out infinite}
.is-climbing .j-sh-r{animation:climb-sh-r var(--climb-dur) ease-in-out infinite}
.is-climbing .j-torso{animation:climb-torso var(--climb-dur) ease-in-out infinite}
.is-climbing .j-head{animation:climb-head var(--climb-dur) ease-in-out infinite}
.is-climbing .j-ua-l{animation:climb-ua-l var(--climb-dur) ease-in-out infinite}
.is-climbing .j-fa-l{animation:climb-fa-l var(--climb-dur) ease-in-out infinite}
.is-climbing .j-ua-r{animation:climb-ua-r var(--climb-dur) ease-in-out infinite}
.is-climbing .j-fa-r{animation:climb-fa-r var(--climb-dur) ease-in-out infinite}
.is-descending .j-body{animation:climb-body var(--climb-dur) ease-in-out infinite reverse}
.is-descending .j-th-l{animation:climb-th-l var(--climb-dur) ease-in-out infinite reverse}
.is-descending .j-sh-l{animation:climb-sh-l var(--climb-dur) ease-in-out infinite reverse}
.is-descending .j-th-r{animation:climb-th-r var(--climb-dur) ease-in-out infinite reverse}
.is-descending .j-sh-r{animation:climb-sh-r var(--climb-dur) ease-in-out infinite reverse}
.is-descending .j-torso{animation:climb-torso var(--climb-dur) ease-in-out infinite reverse}
.is-descending .j-head{animation:climb-head var(--climb-dur) ease-in-out infinite reverse}
.is-descending .j-ua-l{animation:climb-ua-l var(--climb-dur) ease-in-out infinite reverse}
.is-descending .j-fa-l{animation:climb-fa-l var(--climb-dur) ease-in-out infinite reverse}
.is-descending .j-ua-r{animation:climb-ua-r var(--climb-dur) ease-in-out infinite reverse}
.is-descending .j-fa-r{animation:climb-fa-r var(--climb-dur) ease-in-out infinite reverse}
.is-summit .j-body{animation:summit-body var(--summit-dur) ease-in-out 1 forwards}
.is-summit .j-th-l{animation:summit-th-l var(--summit-dur) ease-in-out 1 forwards}
.is-summit .j-sh-l{animation:summit-sh-l var(--summit-dur) ease-in-out 1 forwards}
.is-summit .j-th-r{animation:summit-th-r var(--summit-dur) ease-in-out 1 forwards}
.is-summit .j-sh-r{animation:summit-sh-r var(--summit-dur) ease-in-out 1 forwards}
.is-summit .j-torso{animation:summit-torso var(--summit-dur) ease-in-out 1 forwards}
.is-summit .j-head{animation:summit-head var(--summit-dur) ease-in-out 1 forwards}
.is-summit .j-ua-l{animation:summit-ua-l var(--summit-dur) ease-in-out 1 forwards}
.is-summit .j-fa-l{animation:summit-fa-l var(--summit-dur) ease-in-out 1 forwards}
.is-summit .j-ua-r{animation:summit-ua-r var(--summit-dur) ease-in-out 1 forwards}
.is-summit .j-fa-r{animation:summit-fa-r var(--summit-dur) ease-in-out 1 forwards}
.is-summit .puffs{animation:summit-puffs var(--summit-dur) linear 1 forwards}
.is-summit .brr{animation:summit-brr var(--summit-dur) linear 1 forwards}
.is-paused .climber *,.climber.is-paused *{animation-play-state:paused}</style>
