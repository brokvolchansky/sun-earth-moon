<svg xmlns="http://www.w3.org/2000/svg" class="climber" viewBox="0 0 200 240" width="200" height="240">
<style>.climber{--climb-dur:1.4s;--summit-dur:9s;overflow:visible}
.climber .fig{fill:var(--color,#ff7a00);stroke:var(--color,#ff7a00)}
.climber .brr{fill:none}
.climber .puffs,.climber .brr{opacity:0}
.climber.no-fx .puffs,.climber.no-fx .brr{display:none}
.j-body{transform:translateY(0px)}
.j-th-l{transform-box:view-box;transform-origin:92px 140px;transform:rotate(4deg)}
.j-sh-l{transform-box:view-box;transform-origin:92px 176px;transform:rotate(0deg)}
.j-th-r{transform-box:view-box;transform-origin:108px 140px;transform:rotate(-75deg)}
.j-sh-r{transform-box:view-box;transform-origin:108px 176px;transform:rotate(80deg)}
.j-torso{transform-box:view-box;transform-origin:100px 140px;transform:rotate(-4deg)}
.j-head{transform-box:view-box;transform-origin:100px 84px;transform:rotate(-6deg)}
.j-ua-l{transform-box:view-box;transform-origin:84px 94px;transform:rotate(165deg)}
.j-fa-l{transform-box:view-box;transform-origin:84px 121px;transform:rotate(15deg)}
.j-ua-r{transform-box:view-box;transform-origin:116px 94px;transform:rotate(-70deg)}
.j-fa-r{transform-box:view-box;transform-origin:116px 121px;transform:rotate(-110deg)}
