@keyframes summit-th-l{0%{transform:rotate(4deg)} 9%{transform:rotate(2deg)} 28%{transform:rotate(95deg)} 74%{transform:rotate(95deg)} 82%{transform:rotate(2deg)} 88%{transform:rotate(30deg)} 94%{transform:rotate(4deg)} 100%{transform:rotate(4deg)}}
@keyframes summit-sh-l{0%{transform:rotate(0deg)} 9%{transform:rotate(0deg)} 28%{transform:rotate(-175deg)} 74%{transform:rotate(-175deg)} 82%{transform:rotate(0deg)} 88%{transform:rotate(-40deg)} 94%{transform:rotate(0deg)} 100%{transform:rotate(0deg)}}
